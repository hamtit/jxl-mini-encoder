[package]
name = "jxl-mini-encoder"
version = "0.3.0"
edition = "2024"
description = "A small pure-Rust JPEG XL encoder for 8-bit sRGB RGB/RGBA, with lossy (VarDCT) and lossless (Modular) encoding"
license = "BSD-3-Clause"
publish = false

[dependencies]

[dev-dependencies]
jxl-oxide = "0.12"
png = "0.18"
jpeg-decoder = "0.3"
ssimulacra2 = "0.5"

[profile.release]
opt-level = 3

[profile.test]
opt-level = 3
